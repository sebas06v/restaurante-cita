# Blueprint de Render. Importe el repositorio y Render lee este archivo.
services:
  - type: web
    name: el-guayacan
    runtime: node
    plan: free
    # Cero dependencias: no hay nada que instalar ni que compilar.
    buildCommand: echo "Cero dependencias: nada que instalar."
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      # Render inyecta PORT. HOST debe ser 0.0.0.0 o el health check falla.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      # Secretos: se ponen a mano en el panel de Render, nunca en el repo.
      - key: DEEPSEEK_API_KEY
        sync: false
      # PIN del panel de sala. Si no se define, la app genera uno al azar
      # y lo imprime en el log de arranque.
      - key: GUAYACAN_PIN
        sync: false
      # Redis para la cola de correos (BullMQ). Sin esta variable la cola
      # sigue funcionando en memoria, pero lo pendiente se pierde al
      # reiniciar. Pegue aquí la URL interna del Key Value de Render, o la
      # de cualquier Redis (Upstash tiene plan gratis).
      - key: REDIS_URL
        sync: false
      # Envío real de correos. Sin esta variable los correos se guardan en
      # la bandeja del panel en vez de salir.
      - key: RESEND_API_KEY
        sync: false
      # Para los enlaces dentro de los correos.
      - key: PUBLIC_URL
        sync: false
